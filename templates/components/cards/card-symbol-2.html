{% for data in data_list %}
    <div class="d-flex mb-5">
        <div class="symbol symbol-50 symbol-2by3 flex-shrink-0 mr-4">
            <div class="d-flex flex-column">
                <div class="symbol symbol-60 symbol-2by3 flex-shrink-0 symbol-light mb-3 ">
                    <div class="symbol-label">
                        <img src="{{ data.icon.image.url }}" class="h-50 align-self-center" alt="">
                    </div>
                </div>
                {% url 'ledger:modal_update_category' data.id as update_category %}
                <a data-open-modal
                    data-modal-url="{{ update_category }}"
                    data-modal-id=""
                    data-modal-size="" class="btn btn-light-primary font-weight-bolder py-2 font-size-sm">View</a>
            </div>
        </div>
        <div class="d-flex flex-column flex-grow-1 my-lg-0 my-2 pr-3">
            <span class="text-dark-75 font-weight-bolder font-size-lg mb-2">{{ data.name }}</span>
            <span class="text-muted font-weight-bold font-size-sm mb-3">{{ data.description|truncatechars:130 }}</span>
            {% if data.is_default %}<span class="label label-pill label-inline label-lg mr-2 w-90px">Default</span>{% endif %}
        </div>
    </div>
    <div class="separator separator-solid mb-5"></div>

{% empty %}
    {% include 'components/empty.html' %}
{% endfor %}

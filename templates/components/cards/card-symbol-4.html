{% load static humanize %}
{% for data in data_list %}
    <div class="col-12">
        <div class="d-flex">
            <label class="checkbox checkbox-lg checkbox-inline flex-shrink-0 m-0 mx-4">
                <input class="budget-checked" type="checkbox" name="selected_budget" value="{{ data.id }}" checked>
                <span></span>
            </label>
            <div class="symbol symbol-50 symbol-2by3 flex-shrink-0 mr-4">
                <div class="d-flex flex-column">
                    <div class="symbol symbol-60 symbol-2by3 flex-shrink-0 symbol-light mb-3 ">
                        <div class="symbol-label">
                            <img src="{{ data.category.icon.image.url }}" class="h-50 align-self-center" alt="">
                        </div>
                    </div>
                </div>
            </div>
            <div class="d-flex flex-column flex-grow-1 my-lg-0 my-2 pr-3">
                <span class="text-dark-75 font-weight-bolder font-size-lg">{{ data.category.name }}</span>
                <span class="text-muted font-weight-bold font-size-sm mb-3">{{ data.category.description|truncatechars:30 }}</span>
            </div>
            <div class="d-flex flex-column  my-lg-0 my-2 pr-3 text-right min-w-110px">
                <span class="font-weight-bolder pt-1 font-size-h6 mt-3">
                    <span class="font-weight-bold text-dark-50">₱</span>
                    {{ data.limit|floatformat:2|intcomma }}
                </span>
                <span class="text-muted font-size-sm ">Limit: </span>
            </div>
        </div>
        <div class="separator separator-solid mb-5 mt-2"></div>
    </div>
{% empty %}
    {% include 'components/empty.html' %}
{% endfor %}

{% load static %}
{% for data in data_list %}
    <div class="col-12">
        <div class="d-flex">
            <div class="symbol symbol-50 symbol-2by3 flex-shrink-0 mr-4">
                <div class="d-flex flex-column">
                    <div class="symbol symbol-60 symbol-2by3 flex-shrink-0 symbol-light mb-3 ">
                        <div class="symbol-label">
                            <img src="{{ data.icon.image.url }}" class="h-50 align-self-center" alt="">
                        </div>
                    </div>
                </div>
            </div>
            <div class="d-flex flex-column flex-grow-1 my-lg-0 my-2 pr-3">
                <span class="text-dark-75 font-weight-bolder font-size-lg">{{ data.name }}</span>
                <span class="text-muted font-weight-bold font-size-sm mb-3">{{ data.description|truncatechars:60 }}</span>
            </div>
            <div class="d-flex flex-column  my-lg-0 my-2 pr-3 text-right min-w-110px">
                {% url 'ledger:modal_add_budget' data.id as add_budget %}
                <a data-open-modal="" data-modal-url="{{ add_budget }}" data-modal-id="" data-modal-size="" class="btn btn-light-primary font-weight-bolder py-2 font-size-sm my-auto">Set Budget</a>
            </div>
        </div>
        <div class="separator separator-solid mb-5"></div>
    </div>
{% empty %}
    {% include 'components/empty.html' %}
{% endfor %}
